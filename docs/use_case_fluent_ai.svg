<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050">
  <defs>
    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #222; }
      .label { font: 16px Arial, sans-serif; fill: #222; text-anchor: middle; }
      .small { font: italic 14px Arial, sans-serif; fill: #444; text-anchor: middle; }
      .system { fill: #fff; stroke: #333; stroke-width: 2; }
      .case { fill: #f7f5ff; stroke: #5b4bc4; stroke-width: 2; }
      .assoc { fill: none; stroke: #555; stroke-width: 1.7; }
      .include { fill: none; stroke: #777; stroke-width: 1.5; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .actor { fill: none; stroke: #333; stroke-width: 2.5; stroke-linecap: round; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#777"/>
    </marker>
  </defs>

  <rect x="205" y="35" width="1160" height="975" rx="4" class="system"/>
  <text x="235" y="70" class="title">Sistem Fluent AI</text>

  <!-- Actor -->
  <circle cx="92" cy="465" r="25" class="actor"/>
  <path d="M92 490 L92 565 M45 520 L139 520 M92 565 L52 620 M92 565 L132 620" class="actor"/>
